name: Release

# The ONLY way to cut a release. Bumps the version literals, commits them to
# main, tags that exact commit (so tags always carry correct literals), then
# builds + publishes. Direct `git tag` pushes are inert: no workflow listens
# to them.
#
# Version scheme: versionName 0.MINOR, versionCode MINOR (e.g. v0.7 -> 0.7/7).
#
# Usage: Actions → Release → Run workflow (branch: main).
# Leave `version` empty to auto-bump minor from the latest tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.7). Empty auto-bumps minor from the latest tag.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-and-tag:
    name: Bump version, commit & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check for new changes
        # Fail-fast guard: aborts BEFORE any bump commit, tag, or build when
        # main carries no real changes since the latest tag, so accidental
        # clicks never cut an empty release. Bot sync-back commits
        # (chore(fdroid) / [skip ci]) don't count as releasable changes.
        run: |
          LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$LATEST" ]; then
            echo "No previous tag; first release, proceeding."
            exit 0
          fi
          echo "Commits since $LATEST (excluding bot sync-backs):"
          git log "$LATEST..HEAD" --format='- %h %s' --reverse \
            --grep='^chore(fdroid)' --grep='\[skip ci\]' --invert-grep | tee /tmp/release-changes.txt | head -n 30
          COUNT="$(git rev-list --count "$LATEST..HEAD" \
            --grep='^chore(fdroid)' --grep='\[skip ci\]' --invert-grep)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No new non-bot commits since $LATEST. Nothing to release — aborting before any bump/tag."
            exit 1
          fi
          echo "::warning::Releasing with $COUNT new commit(s) since $LATEST (see list above)."

      - name: Resolve version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          if [ -z "$RAW" ]; then
            LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
            if [ -z "$LATEST" ]; then
              RAW="0.1"
            else
              MINOR="${LATEST#v0.}"
              RAW="0.$((MINOR + 1))"
            fi
            echo "No version input; auto-bumped $LATEST -> $RAW."
          fi
          VERSION="${RAW#v}"
          if ! echo "$VERSION" | grep -Eq '^0\.[0-9]+$'; then
            echo "::error::Unsupported version '$RAW'. Expected like 0.7 (versionName 0.MINOR, versionCode MINOR)."
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          echo "VERSION=$VERSION CODE=${VERSION#0.} TAG=$TAG" | tr ' ' '\n' >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved -> versionName=$VERSION versionCode=${VERSION#0.} tag=$TAG"

      - name: Bump version literals
        run: |
          python3 - "$VERSION" "$CODE" <<'EOF'
          import re, sys
          version, code = sys.argv[1], sys.argv[2]
          path = "app/build.gradle.kts"
          text = open(path).read()
          # Literals must stay literal: F-Droid's checkupdates parser reads them.
          new, n1 = re.subn(r"^(\s*)\?: \d+$", rf"\1?: {code}", text, count=1, flags=re.M)
          new, n2 = re.subn(r"^(\s*)\?: \"[\d.]+\"$", rf'\1?: "{version}"', new, count=1, flags=re.M)
          assert n1 == 1 and n2 == 1, "version literal lines not found"
          open(path, "w").write(new)
          sec = "SECURITY.md"
          stext = open(sec).read()
          snew, n3 = re.subn(r"^\| 0\.\d+ +\|", f"| {version}     |", stext, count=1, flags=re.M)
          assert n3 == 1, "SECURITY.md version row not found"
          open(sec, "w").write(snew)
          print(f"bumped to {version} ({code})")
          EOF
          git diff --stat

      - name: Commit, push & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts SECURITY.md
          if git diff --cached --quiet; then
            echo "::error::Nothing to bump (already at $VERSION?)."
            exit 1
          fi
          git commit -m "release: bump to $TAG"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"

  build-and-release:
    name: Build & Publish Release
    needs: bump-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-and-tag.outputs.tag }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ needs.bump-and-tag.outputs.version }}"
          TAG="${{ needs.bump-and-tag.outputs.tag }}"
          if ! echo "$VERSION" | grep -Eq '^0\.[0-9]+$'; then
            echo "::error::Unsupported version '$VERSION'. Expected like 0.7."
            exit 1
          fi
          MINOR="${VERSION#0.}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$MINOR" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$MINOR" >> "$GITHUB_OUTPUT"
          echo "Resolved $VERSION -> versionName=$VERSION versionCode=$MINOR"

      - name: Ensure fastlane changelog exists
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          if [ -f "$CHANGELOG" ]; then
            echo "Changelog $CHANGELOG already exists, leaving it."
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)"
          {
            echo "- Release ${{ steps.version.outputs.version_name }}."
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --format='- %s' --reverse | head -n 20
            else
              git log --format='- %s' --reverse | head -n 20
            fi
          } > "$CHANGELOG"
          cat "$CHANGELOG"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Prepare Keystore from Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > starpath-release.jks

      - name: Build Signed Release APK & Bundle
        env:
          KEYSTORE_PATH: starpath-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Generate Checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/versioned/*.apk release-artifacts/
          cp app/build/outputs/bundle/versioned/*.aab release-artifacts/
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Sync F-Droid metadata & changelog back to main
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version_name }}"
          CODE="${{ steps.version.outputs.version_code }}"
          SHA="$(git rev-list -n 1 "$TAG")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          python3 - "$VERSION" "$CODE" "$SHA" <<'EOF'
          import re, sys
          version, code, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          path = "fdroid/app.starpath.yml"
          text = open(path).read()
          if f"versionName: '{version}'" in text:
              print(f"fdroid metadata already contains {version}, skipping.")
          else:
              entry = (
                  f"  - versionName: '{version}'\n"
                  f"    versionCode: {code}\n"
                  f"    commit: {sha}\n"
                  f"    subdir: app\n"
                  f"    gradle:\n"
                  f"      - yes\n"
              )
              anchor = "AllowedAPKSigningKeys:"
              assert anchor in text, "AllowedAPKSigningKeys anchor not found"
              text = text.replace(anchor, entry + "\n" + anchor, 1)
              text = re.sub(r"^CurrentVersion: '.*'$",
                            f"CurrentVersion: '{version}'", text, count=1, flags=re.M)
              text = re.sub(r"^CurrentVersionCode: .*$",
                            f"CurrentVersionCode: {code}", text, count=1, flags=re.M)
              open(path, "w").write(text)
              print(f"fdroid metadata updated to {version} ({code}).")
          EOF
          git add "fastlane/metadata/android/en-US/changelogs/$CODE.txt" fdroid/app.starpath.yml
          if git diff --cached --quiet; then
            echo "Nothing to sync, skipping commit."
            exit 0
          fi
          git commit -m "chore(fdroid): sync metadata for $TAG [skip ci]"
          git pull --rebase origin main
          git push origin main
