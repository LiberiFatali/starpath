name: Release

on:
  # Releases are cut via the prepare-release workflow (bump → commit → tag →
  # call). Direct `git tag` pushes are inert: no trigger listens to them.
  workflow_call:
    inputs:
      version:
        description: 'Version to release (e.g. 0.7 or v0.7).'
        required: true
        type: string
      tag:
        description: 'Tag to build (e.g. v0.7). Empty builds the calling ref.'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.7 or v0.7). Only used for manual runs without a tag.'
        required: true
        default: ''
      tag:
        description: 'Tag to build (e.g. v0.7). Empty builds the selected branch.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag == '' && github.ref || inputs.tag }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          if [ -z "$RAW" ]; then
            echo "::error::'version' input is required (e.g. 0.7)."
            exit 1
          fi
          # Accept with or without leading 'v'; TAG is always the v form so
          # git lookups (rev-list, tag list) work regardless of input style.
          VERSION="${RAW#v}"
          TAG="v$VERSION"
          if ! echo "$VERSION" | grep -Eq '^0\.[0-9]+$'; then
            echo "::error::Unsupported version '$RAW'. Expected tag like v0.7 (versionName 0.MINOR, versionCode MINOR). Patch/major versions need the computed versionCode scheme migration."
            exit 1
          fi
          MINOR="${VERSION#0.}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$MINOR" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$MINOR" >> "$GITHUB_OUTPUT"
          echo "Resolved $RAW -> versionName=$VERSION versionCode=$MINOR"

      - name: Ensure fastlane changelog exists
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          if [ -f "$CHANGELOG" ]; then
            echo "Changelog $CHANGELOG already exists, leaving it."
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)"
          {
            echo "- Release ${{ steps.version.outputs.version_name }}."
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --format='- %s' --reverse | head -n 20
            else
              git log --format='- %s' --reverse | head -n 20
            fi
          } > "$CHANGELOG"
          cat "$CHANGELOG"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Prepare Keystore from Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > starpath-release.jks

      - name: Build Signed Release APK & Bundle
        env:
          KEYSTORE_PATH: starpath-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Generate Checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/versioned/*.apk release-artifacts/
          cp app/build/outputs/bundle/versioned/*.aab release-artifacts/
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Sync F-Droid metadata & changelog back to main
        # Runs for workflow_call (prepare-release path). Manual
        # workflow_dispatch runs build only and skip the sync-back.
        if: github.event_name != 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version_name }}"
          CODE="${{ steps.version.outputs.version_code }}"
          SHA="$(git rev-list -n 1 "$TAG")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          python3 - "$VERSION" "$CODE" "$SHA" <<'EOF'
          import re, sys
          version, code, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          path = "fdroid/app.starpath.yml"
          text = open(path).read()
          if f"versionName: '{version}'" in text:
              print(f"fdroid metadata already contains {version}, skipping.")
          else:
              entry = (
                  f"  - versionName: '{version}'\n"
                  f"    versionCode: {code}\n"
                  f"    commit: {sha}\n"
                  f"    subdir: app\n"
                  f"    gradle:\n"
                  f"      - yes\n"
              )
              anchor = "AllowedAPKSigningKeys:"
              assert anchor in text, "AllowedAPKSigningKeys anchor not found"
              text = text.replace(anchor, entry + "\n" + anchor, 1)
              text = re.sub(r"^CurrentVersion: '.*'$",
                            f"CurrentVersion: '{version}'", text, count=1, flags=re.M)
              text = re.sub(r"^CurrentVersionCode: .*$",
                            f"CurrentVersionCode: {code}", text, count=1, flags=re.M)
              open(path, "w").write(text)
              print(f"fdroid metadata updated to {version} ({code}).")
          EOF
          git add "fastlane/metadata/android/en-US/changelogs/$CODE.txt" fdroid/app.starpath.yml
          if git diff --cached --quiet; then
            echo "Nothing to sync, skipping commit."
            exit 0
          fi
          git commit -m "chore(fdroid): sync metadata for $TAG [skip ci]"
          git pull --rebase origin main
          git push origin main
